---
kind: ServiceAccount
apiVersion: v1
metadata:
  name: superset-dev
  namespace: jenkins-workers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: superset-dev
  namespace: superset-dev
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: superset-dev
  namespace: superset-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: superset-dev
subjects:
  - kind: ServiceAccount
    name: superset-dev
    namespace: jenkins-workers
